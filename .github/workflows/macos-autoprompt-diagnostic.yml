name: macOS autoprompt diagnosis
on:
  push:
    branches: [ci/6595-macos-initialization]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
      - name: Install using repository CI procedure
        run: python scripts/ci/install
      - name: Reproduce race and verify correction
        run: python ci-probes/run.py
      - name: Save diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-autoprompt-diagnostics
          path: diagnostic-results/
